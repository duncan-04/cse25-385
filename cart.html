<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cart</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700;900&family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  
  <link rel="stylesheet" href="styles.css">

    <style>
    :root {
    --black: #0a0a0a;
    --white: #f5f5f0;
    --red: #e63323;
    --steel: #b0b8c1;
    --blue-pale: #c8dce8;
    --blue-mid: #7aadca;
    --dark-green: #1e3a2f;
    --mid-green: #2d4f3c;
    --light-bg: #dce8ee;
    --nav-h: 52px;
  }
 
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    font-family: 'Barlow', sans-serif;
    background: var(--white);
    color: var(--black);
    overflow-x: hidden;
  }
 
  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    height: var(--nav-h);
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    display: flex; align-items: center;
    padding: 0 28px;
    gap: 32px;
  }
  .nav-brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.35rem;
    letter-spacing: 2px;
    color: var(--black);
    white-space: nowrap;
    margin-right: 16px;
  }
  nav a {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #444;
    text-decoration: none;
    cursor: pointer;
    padding: 4px 0;
    border-bottom: 2px solid transparent;
    transition: color .2s, border-color .2s;
    white-space: nowrap;
  }
  nav a:hover, nav a.active { color: var(--red); border-bottom-color: var(--red); }

  /* ══════════════════════════════════════
     CART PAGE
  ══════════════════════════════════════ */
  .cart-page { background: #fff; }
  .cart-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 32px; border-bottom: 1px solid #eee;
    background: #fff;
  }
  .cart-topbar h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1rem; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
  }
  .cart-topbar-icons { display: flex; gap: 20px; }
  .cart-topbar-icons svg { width: 24px; cursor: pointer; color: #333; }
 
  .cart-empty {
    background: #8a8a8a; padding: 60px 40px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .cart-empty svg { width: 60px; color: #2a2a6a; }
  .cart-empty h3 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.3rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase;
  }
  .cart-empty p { font-size: 0.9rem; font-weight: 600; }
 
  .cart-items-list { padding: 24px 40px; min-height: 80px; }
  .cart-item-row {
    display: grid; grid-template-columns: 60px 1fr auto auto;
    gap: 16px; align-items: center; padding: 16px 0;
    border-bottom: 1px solid #eee;
  }
  .cart-item-row img { width: 60px; height: 40px; object-fit: cover; border-radius: 3px; }
  .cart-item-row h4 { font-size: 0.85rem; font-weight: 700; }
  .cart-item-row .qty { font-size: 0.8rem; color: #666; }
  .cart-item-price { font-weight: 700; font-size: 0.9rem; }
  .remove-btn { background: none; border: none; cursor: pointer; color: #999; font-size: 1.1rem; }
  .remove-btn:hover { color: var(--red); }
 
  .order-details { padding: 0 40px 40px; }
  .order-details h3 { font-size: 1rem; font-weight: 700; margin-bottom: 20px; text-decoration: underline; }
  .order-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 0; border-bottom: 1px solid #eee;
  }
  .order-row span:first-child { font-weight: 700; font-size: 0.9rem; }
  .order-row span:last-child { font-size: 0.9rem; color: #333; }
  .order-row.subtotal span { font-weight: 900; }
  .order-row.subtotal .shop-note { font-size: 0.75rem; font-weight: 700; }
  .shop-note a { color: var(--red); text-decoration: none; }
  .order-row.total span:first-child { font-size: 0.85rem; }
  .order-row.total span:last-child { font-weight: 900; font-size: 1rem; }
  .checkout-btn {
    display: block; width: 100%; background: var(--black); color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.1rem; font-weight: 700; letter-spacing: 2px;
    text-align: center; padding: 18px; border: none; cursor: pointer;
    border-radius: 4px; margin: 24px 0 16px; transition: background .2s;
  }
  .checkout-btn:hover { background: var(--red); }
  .continue-btn {
    display: block; width: 100%; background: #dce8f5; color: var(--black);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1rem; font-weight: 700; letter-spacing: 2px;
    text-align: center; padding: 16px; border: none; cursor: pointer;
    border-radius: 24px;
  }
  .continue-btn:hover { background: #c0d8ef; }
  </style>
  </head>

  <body>
    <script src="script.js" defer></script>

    <!-- NAV -->
<nav>
  <div class="nav-brand">POWERUP BATTERIES</div>
  <a href="index.html">Home</a>
  <a href="about.html">About Us</a>
  <a href="products.html">Products & Services</a>
  <a href="technology.html">Technology</a>
  <a href="shop.html">Shop</a>
  <a href="cart.html">Cart</a>
  <a href="wallet.html">Wallet</a>
  <a href="payment.html">Payment</a>
  <a href="contact.html">Contact</a>
</nav>

    <!-- ══════════════ CART ══════════════ -->
<div id="page-cart" class="page cart-page">
  <div class="cart-topbar">
    <h2>Shop</h2>
    <div class="cart-topbar-icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
    </div>
  </div>
 
  <div id="cart-empty-state" class="cart-empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    <h3>Your Cart is Empty</h3>
    <p>Add items from the shop to get started</p>
  </div>
 
  <div class="cart-items-list" id="cart-items-list"></div>
 
  <div class="order-details">
    <h3>Order Details</h3>
    <div class="order-row">
      <span>Shipping</span>
      <span>$50.00</span>
    </div>
    <div class="order-row">
      <span style="font-weight:400;">Sales Tax</span>
      <span style="color:#888;">Calculated at checkout</span>
    </div>
    <div class="order-row subtotal">
      <span>Subtotal</span>
      <div style="text-align:right;">
        <div id="cart-subtotal">$0.00</div>
        <div class="shop-note">Your cart is empty. <a onclick="showPage('shop')" style="cursor:pointer;">Shop now</a> &#8594;</div>
      </div>
    </div>
    <div class="order-row total">
      <span>Total</span>
      <span id="cart-total">$0.00</span>
    </div>
    <button class="checkout-btn" onclick="checkout()">Checkout</button>
    <button class="continue-btn" onclick="showPage('shop')">Continue Shopping</button>
  </div>
</div>
 
 
</body>
</html>
