<!DOCTYPE html>
<html lang="en">
  <head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  
  <link rel="stylesheet" href="styles.css">

    
  </head>

  <body>
    <script src="script.js" defer></script>

    <!-- NAV -->
<nav>
  <div class="nav-logo">P<span>O</span>WER<span>↑</span>P</div>
  <a onclick="showPage('home')" id="nav-home" class="active">Home</a>
  <a onclick="showPage('about')" id="nav-about">About Us</a>
  <a onclick="showPage('products')" id="nav-products">Products &amp; Services</a>
  <a onclick="showPage('technology')" id="nav-technology">Technology</a>
  <a onclick="showPage('shop')" id="nav-shop">Shop</a>
  <a onclick="showPage('cart')" id="nav-cart">Cart</a>
  <a onclick="showPage('wallet')" id="nav-wallet">Wallet</a>
  <a onclick="showPage('payment')" id="nav-payment">Payment</a>
  <a onclick="showPage('contact')" id="nav-contact">Contact</a>
</nav>
    
<!-- ══════════════ CART ══════════════ -->
<div id="page-cart" class="page cart-page">
  <div class="cart-topbar">
    <h2>Shop</h2>
    <div class="cart-topbar-icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
    </div>
  </div>
 
  <div id="cart-empty-state" class="cart-empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    <h3>Your Cart is Empty</h3>
    <p>Add items from the shop to get started</p>
  </div>
 
  <div class="cart-items-list" id="cart-items-list"></div>
 
  <div class="order-details">
    <h3>Order Details</h3>
    <div class="order-row">
      <span>Shipping</span>
      <span>$50.00</span>
    </div>
    <div class="order-row">
      <span style="font-weight:400;">Sales Tax</span>
      <span style="color:#888;">Calculated at checkout</span>
    </div>
    <div class="order-row subtotal">
      <span>Subtotal</span>
      <div style="text-align:right;">
        <div id="cart-subtotal">$0.00</div>
        <div class="shop-note">Your cart is empty. <a onclick="showPage('shop')" style="cursor:pointer;">Shop now</a> &#8594;</div>
      </div>
    </div>
    <div class="order-row total">
      <span>Total</span>
      <span id="cart-total">$0.00</span>
    </div>
    <button class="checkout-btn" onclick="checkout()">Checkout</button>
    <button class="continue-btn" onclick="showPage('shop')">Continue Shopping</button>
  </div>
</div>
    
</body>
</html>
