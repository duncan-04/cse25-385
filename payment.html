<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PowerUp Batteries</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700;900&family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet"/>

 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 
<style>
  :root {
    --black: #0a0a0a;
    --white: #f5f5f0;
    --red: #e63323;
    --steel: #b0b8c1;
    --blue-pale: #c8dce8;
    --blue-mid: #7aadca;
    --dark-green: #1e3a2f;
    --mid-green: #2d4f3c;
    --light-bg: #dce8ee;
    --nav-h: 52px;
  }
 
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    font-family: 'Barlow', sans-serif;
    background: var(--white);
    color: var(--black);
    overflow-x: hidden;
  }
 
  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    height: var(--nav-h);
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    display: flex; align-items: center;
    padding: 0 28px;
    gap: 32px;
  }
  .nav-brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.35rem;
    letter-spacing: 2px;
    color: var(--black);
    white-space: nowrap;
    margin-right: 16px;
  }
  nav a {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #444;
    text-decoration: none;
    cursor: pointer;
    padding: 4px 0;
    border-bottom: 2px solid transparent;
    transition: color .2s, border-color .2s;
    white-space: nowrap;
  }
  nav a:hover, nav a.active { color: var(--red); border-bottom-color: var(--red); }

  /* ══════════════════════════════════════
     PAYMENT PAGE
  ══════════════════════════════════════ */
  .payment-page { background: #eef4f2; min-height: 100vh; }
  .payment-inner { max-width: 700px; margin: 0 auto; padding: 60px 24px; }
  .payment-inner h1 {
    font-size: 1rem; color: #666; text-align: center; margin-bottom: 32px;
    font-weight: 400; letter-spacing: .5px;
  }
  .payment-group {
    background: #fff; border-radius: 12px; padding: 20px 28px; margin-bottom: 16px;
    display: grid; grid-template-columns: 140px 1fr; align-items: center; gap: 20px;
  }
  .payment-group h3 { font-size: 0.9rem; font-weight: 500; color: #444; }
  .payment-logos { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .logo-badge {
    padding: 6px 14px; border-radius: 6px; font-weight: 700; font-size: 0.85rem;
    display: flex; align-items: center; gap: 6px;
  }
  .logo-mc { background: linear-gradient(135deg,#eb001b,#f79e1b); width: 40px; height: 26px; border-radius: 4px; position: relative; }
  .logo-mc::after { content:''; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:14px; height:26px; background:#f79e1b; border-radius:2px; opacity:.7; }
  .logo-visa { color: #1434CB; font-weight: 900; font-size: 1rem; font-style: italic; font-family: 'Barlow', sans-serif; }
  .logo-discover { font-weight: 900; font-size: 0.8rem; color: #f60; letter-spacing: 1px; }
  .logo-amex { background: #2E77BC; color: #fff; font-size: 0.72rem; font-weight: 900; padding: 4px 8px; border-radius: 4px; }
  .logo-apple { font-size: 0.9rem; font-weight: 500; color: #000; }
  .logo-gpay { font-size: 0.85rem; font-weight: 700; }
  .logo-gpay span:first-child { color: #4285F4; }
  .logo-gpay span:nth-child(2) { color: #EA4335; }
  .logo-gpay span:nth-child(3) { color: #FBBC05; }
  .logo-gpay span:nth-child(4) { color: #34A853; }
  .logo-alipay { font-size: 1.2rem; }
  .logo-tether { color: #26A17B; font-weight: 900; font-size: 0.8rem; }
  .logo-btc { color: #F7931A; font-weight: 900; }
  .logo-eth { color: #627EEA; font-weight: 900; }
  .logo-more { font-size: 0.85rem; font-weight: 700; color: #555; }
  .logo-paypal { color: #003087; font-weight: 900; font-size: 0.85rem; }
  .logo-paypal span { color: #009cde; }
 
</style>
</head>
 
<body>
 <script src="script.js" defer></script>

 <!-- NAV -->
<nav>
  <div class="nav-brand">POWERUP BATTERIES</div>
  <a href="index.html">Home</a>
  <a href="about.html">About Us</a>
  <a href="products.html">Products & Services</a>
  <a href="technology.html">Technology</a>
  <a href="shop.html">Shop</a>
  <a href="cart.html">Cart</a>
  <a href="wallet.html">Wallet</a>
  <a href="payment.html">Payment</a>
  <a href="contact.html">Contact</a>
</nav>
 

<!-- ══════════════ PAYMENT ══════════════ -->
<div id="page-payment" class="page payment-page">
  <div class="payment-inner">
    <h1>Supported Payment Methods</h1>
 
    <div class="payment-group">
      <h3>Credit Cards</h3>
      <div class="payment-logos">
        <div class="logo-mc"></div>
        <div class="logo-visa">VISA</div>
        <div class="logo-discover">DISCOVER</div>
        <div class="logo-amex">AMEX</div>
      </div>
    </div>
 
    <div class="payment-group">
      <h3>Digital Wallet</h3>
      <div class="payment-logos">
        <div class="logo-apple">&#xf8ff; Pay</div>
        <div class="logo-gpay"><span>G</span><span>o</span><span>o</span><span>g</span>le Pay</div>
        <div class="logo-alipay">&#x652F;&#x4ED8;&#x5B9D;</div>
        <div style="font-size:1.2rem;">&#x2705;</div>
      </div>
    </div>
 
    <div class="payment-group">
      <h3>Cryptocurrencies</h3>
      <div class="payment-logos">
        <div class="logo-tether">&#x20AE; USDT</div>
        <div class="logo-btc">&#x20BF;</div>
        <div class="logo-eth">&#x25C6;</div>
        <div class="logo-more">25+</div>
        <div class="logo-paypal">Pay<span>Pal</span></div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
