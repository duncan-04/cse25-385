  <!-- PAYMENT METHODS -->
<div class="payment-methods">
  <div class="pm-grid">
    <!-- PayPal -->
    <div class="pm-card"><span class="pm-text paypal"><span style="color:#003087;font-weight:800;">P</span><span style="color:#009cde;font-weight:800;">P</span> PayPal</span></div>
    <!-- Mastercard -->
    <div class="pm-card"><div class="mc-circles"><div class="mc-red"></div><div class="mc-yellow"></div></div><div style="font-size:0.6rem;color:#666;margin-top:2px;text-align:center;">mastercard</div></div>
    <!-- Visa -->
    <div class="pm-card"><span class="pm-text visa">VISA</span></div>
    <!-- Maestro -->
    <div class="pm-card">
      <div class="maestro-wrap">
        <div class="maestro-circles"><div class="m-red"></div><div class="m-blue"></div></div>
        <div class="maestro-label">maestro</div>
      </div>
    </div>
    <!-- Apple Pay -->
    <div class="pm-card"><span class="pm-text applepay"> Pay</span></div>
    <!-- Amazon Pay -->
    <div class="pm-card">
      <div class="amazon-pay">
        <span class="ap-pay">pay</span>
        <span class="ap-arrow">~</span>
      </div>
    </div>
    <!-- Google Pay -->
    <div class="pm-card"><span class="pm-text gpay"><span class="g">G</span> Pay</span></div>
    <!-- Stripe -->
    <div class="pm-card"><span class="pm-text stripe">stripe</span></div>
  </div>
