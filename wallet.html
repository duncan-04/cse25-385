<!-- PAYMENT FORM -->
<div class="payment-section">
  <h2>Add Card</h2>
  <div style="align-self:flex-start;max-width:500px;width:100%;">
    <div style="color:#ccc;font-size:0.9rem;font-weight:600;margin-bottom:8px;">Payment</div>
  </div>
  <input class="pay-input" type="text" placeholder="CARD NAME" />
  <input class="pay-input" type="text" placeholder="CARD NUMBER" />
  <div class="pay-row">
    <input class="pay-input" type="text" placeholder="MM/YY" />
    <input class="pay-input" type="text" placeholder="CVV" />
  </div>
  <button class="pay-submit">Submit →</button>
</div>
